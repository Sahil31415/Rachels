{% extends 'base.html' %}

{% block title %}Sign In — Rachels{% endblock %}

{% block head %}
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    /* ===============================
       THEME VARIABLES
       =============================== */
    :root {
        --brand-primary: #4318FF;
        --brand-hover: #3311db;
        --text-main: #2B3674;
        --text-secondary: #A3AED0;
        --bg-body: #F4F7FE;
        --bg-input: #F4F7FE;
        --radius-card: 20px;
        --radius-input: 16px;
    }

    /* ===============================
       LAYOUT OVERLAY (The Fix)
       =============================== */
    /* This breaks the login form out of the dashboard container */
    .login-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: var(--bg-body);
        z-index: 9999; /* Sit on top of everything */
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-y: auto; /* Allow scroll on small screens */
    }

    /* ===============================
       LOGIN CARD STYLE
       =============================== */
    .login-card {
        background: #ffffff;
        width: 100%;
        max-width: 420px; /* Standard width for login cards */
        border-radius: 24px; /* Slightly rounder */
        padding: 48px 40px;
        box-shadow: 0px 20px 50px rgba(112, 144, 176, 0.12); /* Softer shadow */
        text-align: left;
        margin: 20px; /* Margin for mobile spacing */
    }

    /* Header Section */
    .brand-header {
        margin-bottom: 32px;
    }

    .brand-header h1 {
        color: var(--text-main);
        font-size: 32px;
        font-weight: 700;
        margin: 0 0 8px 0;
        letter-spacing: -0.02em;
    }

    .brand-header p {
        color: var(--text-secondary);
        font-size: 15px;
        margin: 0;
        font-weight: 400;
    }

    /* Form Elements */
    .form-group {
        margin-bottom: 24px;
    }

    label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-main);
        margin-bottom: 10px;
    }
    
    label span {
        color: var(--brand-primary);
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        height: 50px;
        padding: 0 20px;
        box-sizing: border-box;
        border-radius: var(--radius-input);
        border: 1px solid transparent; /* No border by default */
        background-color: var(--bg-input);
        color: var(--text-main);
        font-size: 14px;
        font-family: 'DM Sans', sans-serif;
        transition: all 0.2s ease;
        outline: none;
    }

    input:focus {
        background-color: #ffffff;
        border-color: var(--brand-primary);
        box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1);
    }

    ::placeholder {
        color: var(--text-secondary);
        opacity: 0.6;
    }

    /* Actions */
    .form-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .checkbox-container {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-main);
        cursor: pointer;
    }

    .checkbox-container input {
        accent-color: var(--brand-primary);
        width: 16px;
        height: 16px;
        cursor: pointer;
    }

    .forgot-link {
        color: var(--brand-primary);
        text-decoration: none;
        font-weight: 500;
    }

    /* Submit Button */
    .btn-submit {
        width: 100%;
        height: 50px;
        background-color: var(--brand-primary);
        color: #ffffff;
        border: none;
        border-radius: var(--radius-input);
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 10px rgba(67, 24, 255, 0.25);
    }

    .btn-submit:hover {
        background-color: var(--brand-hover);
        transform: translateY(-2px);
    }

    /* Error Banner */
    .error-banner {
        background-color: #fff5f5;
        border-left: 4px solid #fc8181;
        padding: 12px 16px;
        margin-bottom: 24px;
        border-radius: 4px;
        color: #c53030;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* Footer Text */
    .footer-text {
        margin-top: 24px;
        text-align: left; /* Aligned left to match header in Horizon */
        font-size: 14px;
        color: var(--text-secondary);
    }
    .footer-text a {
        color: var(--brand-primary);
        font-weight: 700;
        text-decoration: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-overlay">
    <div class="login-card">
        
        <div class="brand-header">
            <h1>Sign In</h1>
            <p>Enter your username and password to sign in!</p>
        </div>

        {% if form.errors %}
            <div class="error-banner">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>Incorrect username or password.</span>
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Username<span>*</span></label>
                <input type="text" id="id_username" name="username" placeholder="Username" required autofocus>
            </div>

            <div class="form-group">
                <label for="id_password">Password<span>*</span></label>
                <input type="password" id="id_password" name="password" placeholder="Min. 8 characters" required>
            </div>

            <div class="form-actions">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember_me">
                    Keep me logged in
                </label>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
