<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Rachels Management</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ===============================
       THEME VARIABLES
       (Matches your app design)
       =============================== */
    :root {
        --bg-page: #fdfbf7;      /* Warm Cream */
        --bg-surface: #ffffff;   /* Pure White */
        --border: #e7ded6;       /* Light Tan */
        --primary: #8a5a44;      /* Earthy Brown */
        --primary-hover: #6d4634;
        --text-main: #1a1a1a;
        --text-muted: #6b6b6b;
        --radius: 16px;
        --shadow: 0 10px 40px rgba(138, 90, 68, 0.1);
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg-page);
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    /* ===============================
       BRAND LOGO
       =============================== */
    .brand-logo {
        width: 64px;
        height: 64px;
        background: var(--primary);
        color: white;
        font-size: 28px;
        font-weight: 700;
        display: grid;
        place-items: center;
        border-radius: 16px;
        margin-bottom: 32px;
        box-shadow: 0 4px 15px rgba(138, 90, 68, 0.3);
        animation: dropIn 0.6s ease-out;
    }

    /* ===============================
       LOGIN CARD
       =============================== */
    .login-card {
        width: 100%;
        max-width: 380px;
        background: var(--bg-surface);
        padding: 40px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        animation: slideUp 0.6s ease-out;
    }

    .login-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .login-header h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        color: var(--text-main);
    }

    .login-header p {
        margin: 8px 0 0;
        font-size: 14px;
        color: var(--text-muted);
    }

    /* ===============================
       FORM ELEMENTS
       =============================== */
    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-main);
    }

    input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #fff;
        font-size: 15px;
        color: var(--text-main);
        box-sizing: border-box; /* Fixes width issues */
        transition: all 0.2s;
    }

    input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(138, 90, 68, 0.1);
    }

    /* Button */
    .btn-submit {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-submit:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
    }

    /* Error Message */
    .error-banner {
        background: #FEF2F2;
        border: 1px solid #FECACA;
        color: #DC2626;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        text-align: center;
        margin-bottom: 24px;
    }

    /* Help Text */
    .help-text {
        margin-top: 24px;
        text-align: center;
        font-size: 13px;
        color: var(--text-muted);
    }

    /* Animations */
    @keyframes dropIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>
<body>

    <div class="brand-logo">R</div>

    <div class="login-card">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please enter your details to sign in.</p>
        </div>

        {% if form.errors %}
        <div class="error-banner">
            Incorrect username or password.
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" placeholder="Enter your username" required autofocus value="{{ form.username.value|default:'' }}">
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
            
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}
        </form>

        <div class="help-text">
            <span>Inventory Management System</span>
        </div>
    </div>

</body>
</html>
