{% extends "base.html" %}

{% block title %}Add Vendor{% endblock %}

{% block head %}
<style>
  /* ===============================
     ADD VENDOR – CLEAN & FIXED UI
     =============================== */

  .form-container {
    max-width: 720px;
    margin: 40px auto;
    background: var(--page);
    padding: 48px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    border: 1px solid rgba(90, 64, 50, 0.08);
  }

  /* Header */
  .form-header {
    text-align: center;
    margin-bottom: 36px;
  }

  .form-header h2 {
    margin: 0 0 6px;
    color: var(--accent-600);
    font-size: 26px;
    font-weight: 800;
  }

  .form-header p {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
  }

  /* Inputs */
  .form-control {
    width: 100%;
    height: 48px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(90, 64, 50, 0.15);
    background: #fff;
    font-size: 15px;
    color: var(--text);
    transition: all 0.2s ease;
    box-sizing: border-box;
    font-family: inherit;
  }

  .form-control:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(90, 64, 50, 0.12);
  }

  /* Items Wrapper */
  .items-wrapper {
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(90, 64, 50, 0.08);
    border-radius: 16px;
    padding: 24px;
  }

  /* Item Row */
  .item-row {
    display: grid;
    grid-template-columns: 2.2fr 1.1fr 1.1fr 48px;
    gap: 14px;
    margin-bottom: 14px;
    align-items: center;
    animation: slideDown 0.25s ease;
  }

  .item-row input[type="number"] {
    text-align: right;
  }

  /* Remove button */
  .btn-remove {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: 1px solid rgba(181, 90, 72, 0.25);
    background: #fff;
    color: #a63a2e;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .btn-remove:hover {
    background: #a63a2e;
    color: #fff;
    transform: rotate(90deg);
  }

  /* Add row button */
  .btn-add-row {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    border-radius: 12px;
    border: 2px dashed rgba(90, 64, 50, 0.2);
    background: transparent;
    color: var(--accent);
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-add-row:hover {
    background: rgba(90, 64, 50, 0.05);
    border-color: var(--accent);
  }

  /* Footer actions */
  .form-actions {
    display: flex;
    gap: 16px;
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid rgba(90, 64, 50, 0.1);
  }

  .form-actions .btn {
    flex: 1;
    padding: 14px;
    justify-content: center;
  }

  /* Mobile */
  @media (max-width: 680px) {
    .item-row {
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(90,64,50,0.1);
      background: #fff;
      position: relative;
    }

    .btn-remove {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
    }
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
{% endblock %}

{% block content %}
<main class="form-container">

  <div class="form-header">
    <h2>Add New Vendor</h2>
    <p>Define vendor items along with unit and unit price.</p>
  </div>

  <form method="post">
    {% csrf_token %}

    <div style="margin-bottom:32px;">
      <label>Vendor Name</label>
      {{ form.name }}
    </div>

    <label style="margin-bottom:12px;">Items Provided</label>

    <div class="items-wrapper">
      <div id="itemsWrap">

        <div class="item-row">
          <input type="text"
                 name="items[]"
                 class="form-control"
                 placeholder="Item name"
                 required
                 oninput="autoSetUnit(this)">

          <select name="units[]" class="form-control">
            <option value="kg">Kg</option>
            <option value="g">Gram</option>
            <option value="l">Litre</option>
            <option value="ml">ML</option>
            <option value="pcs">Pieces</option>
            <option value="carton">Carton</option>
            <option value="packet">Packet</option>
          </select>

          <input type="number"
                 name="prices[]"
                 class="form-control"
                 placeholder="Unit price"
                 step="0.01"
                 min="0"
                 required>

          <button type="button" class="btn-remove" onclick="removeItem(this)">🗑</button>
        </div>

      </div>

      <button type="button" class="btn-add-row" onclick="addItem()">＋ Add Another Item</button>
    </div>

    <div class="form-actions">
      <button class="btn primary" type="submit">Save Vendor</button>
      <a class="btn ghost" href="{% url 'Home' %}">Cancel</a>
    </div>

  </form>
</main>
{% endblock %}

{% block scripts %}
<script>
  function guessUnit(name) {
    name = name.toLowerCase();
    if (name.match(/milk|oil|juice|water/)) return "l";
    if (name.match(/flour|atta|maida|rice|wheat|sugar|tomato|onion|potato/)) return "kg";
    if (name.match(/egg|bun|piece/)) return "pcs";
    if (name.match(/packet|pack/)) return "packet";
    if (name.match(/carton|box/)) return "carton";
    return "kg";
  }

  function autoSetUnit(input) {
    const row = input.closest(".item-row");
    row.querySelector("select[name='units[]']").value = guessUnit(input.value);
  }

  function addItem() {
    const wrap = document.getElementById("itemsWrap");
    const div = document.createElement("div");
    div.className = "item-row";
    div.innerHTML = `
      <input type="text" name="items[]" class="form-control" placeholder="Item name" required oninput="autoSetUnit(this)">
      <select name="units[]" class="form-control">
        <option value="kg">Kg</option>
        <option value="g">Gram</option>
        <option value="l">Litre</option>
        <option value="ml">ML</option>
        <option value="pcs">Pieces</option>
        <option value="carton">Carton</option>
        <option value="packet">Packet</option>
      </select>
      <input type="number" name="prices[]" class="form-control" placeholder="Unit price" step="0.01" min="0" required>
      <button type="button" class="btn-remove" onclick="removeItem(this)">🗑</button>
    `;
    wrap.appendChild(div);
    div.querySelector("input").focus();
  }

  function removeItem(btn) {
    const wrap = document.getElementById("itemsWrap");
    if (wrap.children.length <= 1) {
      wrap.children[0].querySelectorAll("input").forEach(i => i.value = "");
      return;
    }
    btn.closest(".item-row").remove();
  }
</script>
{% endblock %}
